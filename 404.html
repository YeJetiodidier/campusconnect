<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .error-code {
            color: #ff9900;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #172b4d;
        }

        p {
            font-size: 14px;
            line-height: 1.5;
            color: #444;
            margin: 0 0 20px 0;
        }

        .sub-heading {
            font-size: 14px;
            color: #6b778c;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: #172b4d;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
        <div class="sub-heading">Why am I seeing this?</div>
        <div class="status-text">Page under maintenance.</div>
    </div>
</body>

</html>
