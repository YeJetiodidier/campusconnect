<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post an Opportunity · CampusConnect</title>
  <style>
    .post-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .post-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .post-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--text);
    }
    .post-header p {
      color: var(--text-muted);
    }
    .form-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section:last-child {
      margin-bottom: 0;
    }
    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .btn-submit {
      background: var(--primary);
      color: white;
    }
    
    @media (max-width: 640px) {
      .form-row {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/postOpportunity-q9XNkAY6.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm2017-CNT9huHz.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-BUhQ76DK.js">
  <link rel="modulepreload" crossorigin href="/assets/permissions-CRGTZZHW.js">
  <link rel="modulepreload" crossorigin href="/assets/internshipsService-D6oBpICv.js">
  <link rel="stylesheet" crossorigin href="/assets/styles-BUVkRhBq.css">
</head>
<body>

  <!-- Re-use our shell nav structure or go standalone. 
       We'll go standalone with a simple top-bar like sell.html, 
       but using styles.css variables. -->
  <header style="padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--surface);">
    <a href="/internships.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">&larr; Back to Internships</a>
    <div style="flex: 1;"></div>
    <span style="font-weight: 600; color: var(--text);">CampusConnect Partner</span>
  </header>

  <main class="post-container">
    <div class="post-header">
      <h1>Post an Opportunity</h1>
      <p>Create a listing for internships, jobs, or research roles.</p>
    </div>

    <div class="form-panel">
      <form id="post-opportunity-form">
        
        <!-- 1. Basic Details -->
        <div class="form-section">
          <div class="section-title">1. Basic Details</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-title">Job Title <span style="color:red">*</span></label>
              <input class="input" id="job-title" type="text" required placeholder="e.g. Research Assistant" />
            </div>
            <div class="form-group">
              <label class="form-label" for="job-company">Company / Organization <span style="color:red">*</span></label>
              <input class="input" id="job-company" type="text" required placeholder="e.g. Dept of Computer Science" />
            </div>
          </div>
          <div class="form-row">
             <div class="form-group">
              <label class="form-label" for="job-logo">Company Logo (Optional)</label>
              <input class="input" id="job-logo" type="file" accept="image/*" />
            </div>
          </div>
        </div>

        <!-- 2. Logistics -->
        <div class="form-section">
          <div class="section-title">2. Logistics</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-type">Opportunity Type</label>
              <select class="input" id="job-type" required>
                <option value="internship">Internship</option>
                <option value="job">Full-time Job</option>
                <option value="part-time">Part-time Role</option>
                <option value="research">Research</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="job-location">Work Mode / Location</label>
              <input class="input" id="job-location" type="text" required placeholder="e.g. On-campus, Remote" />
            </div>
            <div class="form-group">
              <label class="form-label" for="job-deadline">Application Deadline</label>
              <input class="input" id="job-deadline" type="date" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="job-salary">Compensation (Optional)</label>
              <input class="input" id="job-salary" type="text" placeholder="e.g. $15/hr or Unpaid" />
            </div>
            <div class="form-group">
              <label class="form-label" for="job-link">Application Link / Email <span style="color:red">*</span></label>
              <input class="input" id="job-link" type="text" required placeholder="URL or email address" />
            </div>
          </div>
        </div>

        <!-- 3. Description -->
        <div class="form-section">
          <div class="section-title">3. Description</div>
          <div class="form-group">
            <label class="form-label" for="job-desc">Role Description & Requirements <span style="color:red">*</span></label>
            <textarea class="input" id="job-desc" rows="6" required placeholder="Describe the responsibilities, required skills, and any specific qualifications..."></textarea>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-row">
          <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
          <button type="button" class="btn btn-secondary" onclick="alert('Draft saved locally.')">Save as Draft</button>
          <button type="submit" class="btn btn-submit" id="submit-opportunity-btn">Post Opportunity</button>
        </div>

      </form>
    </div>
  </main>

  <script src="/src/theme-init.js"></script> <!-- To immediately apply dark/light mode -->
</body>
</html>
