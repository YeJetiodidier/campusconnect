<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item - CampusConnect</title>
  <script type="module" crossorigin src="/assets/sell-B4P-p0a0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm2017-Dc5VIc4N.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-BecEDHop.js">
  <link rel="stylesheet" crossorigin href="/assets/style-DHTpZXJA.css">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
      <a href="marketplace.html" class="logo">
        <img src="/assets/logo-sBAi_k4z.png" alt="CampusConnect Logo" class="logo-img">
        <span class="logo-text">CampusConnect</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="marketplace.html">← Back to Marketplace</a>
    </nav>
  </header>

  <div class="container small-container">
    <div class="form-card">
      <h2>List an Item for Sale</h2>

      <form id="sellItemForm">
        <div class="form-group">
          <label for="itemTitle">Item Title</label>
          <input type="text" id="itemTitle" placeholder="e.g. MacBook Air M2 2022" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="itemPrice">Price (FCFA)</label>
            <input type="number" id="itemPrice" placeholder="e.g. 850" required>
          </div>

          <div class="form-group">
            <label for="itemCategory">Category</label>
            <select id="itemCategory" required>
              <option value="Electronics">Electronics</option>
              <option value="Textbooks">Textbooks</option>
              <option value="Furniture">Furniture</option>
              <option value="Clothing">Clothing</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="itemCondition">Condition</label>
            <select id="itemCondition" required>
              <option value="Brand New">Brand New</option>
              <option value="Like New">Like New</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
            </select>
          </div>

          <div class="form-group">
            <label for="itemLocation">Pickup Location</label>
            <select id="itemLocation" required>
              <option value="North Campus">North Campus</option>
              <option value="South Campus">South Campus</option>
              <option value="Off-Campus">Off-Campus</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="itemDescription">Description</label>
          <textarea id="itemDescription" rows="4" placeholder="Describe condition, specs, etc." required></textarea>
        </div>

        <div class="form-group">
          <label for="itemImage">Upload Item Photo</label>
          <input type="file" id="itemImage" accept="image/*" required>
        </div>

        <button type="submit" id="submitItemBtn" class="btn-primary full-width">Publish Listing</button>
      </form>
    </div>
  </div>

</body>
</html>
