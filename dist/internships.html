<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internships & Jobs · CampusConnect</title>
  <script type="module" crossorigin src="/assets/internships-BPglO1K_.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm2017-aF7IW9R1.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-CsnSWmcf.js">
  <link rel="modulepreload" crossorigin href="/assets/footer-DPNrPZWS.js">
  <link rel="modulepreload" crossorigin href="/assets/renderCard-CLS294Wn.js">
  <link rel="modulepreload" crossorigin href="/assets/favoritesStore-JloAdjsq.js">
  <link rel="modulepreload" crossorigin href="/assets/internshipsService-B4iR-s-o.js">
  <link rel="stylesheet" crossorigin href="/assets/footer-BUVkRhBq.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="app-main">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
        <div>
          <h1 class="page-title" style="margin-bottom: 4px;">Internships &amp; Jobs</h1>
          <p class="page-subtitle">Discover opportunities posted by verified recruiters and alumni.</p>
        </div>
        <button id="agency-post-btn" class="btn btn-primary" style="display: none;">+ Post Job</button>
      </div>

      <!-- Agency Create Post Form (Hidden) -->
      <div id="create-job-panel" class="panel" style="display: none; margin-bottom: 24px;">
        <h2 style="margin-bottom: 16px;">Post a New Job/Internship</h2>
        <form id="create-job-form">
          <div style="display: flex; gap: 16px; margin-bottom: 16px;">
            <div style="flex: 2;">
              <label class="form-label" for="job-title">Job Title</label>
              <input class="input" id="job-title" type="text" required placeholder="e.g. Frontend Developer Intern" />
            </div>
            <div style="flex: 1;">
              <label class="form-label" for="job-company">Company</label>
              <input class="input" id="job-company" type="text" required placeholder="e.g. Google" />
            </div>
          </div>
          
          <div style="display: flex; gap: 16px; margin-bottom: 16px;">
            <div style="flex: 1;">
              <label class="form-label" for="job-type">Type</label>
              <select class="input" id="job-type" required>
                <option value="internship">Internship</option>
                <option value="job">Full-time Job</option>
                <option value="part-time">Part-time</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label class="form-label" for="job-location">Location</label>
              <input class="input" id="job-location" type="text" required placeholder="e.g. Remote, Kigali..." />
            </div>
          </div>

          <div style="display: flex; gap: 16px; margin-bottom: 16px;">
            <div style="flex: 1;">
              <label class="form-label" for="job-salary">Salary / Stipend (Optional)</label>
              <input class="input" id="job-salary" type="text" placeholder="e.g. Unpaid, $500/mo, 100k XAF" />
            </div>
            <div style="flex: 1;">
              <label class="form-label" for="job-link">Application Link / Email</label>
              <input class="input" id="job-link" type="text" required placeholder="e.g. careers@company.com" />
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <label class="form-label" for="job-logo">Company Logo (Image)</label>
            <input class="input" id="job-logo" type="file" accept="image/*" />
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">For best results, use a square logo.</p>
          </div>

          <div style="display: flex; gap: 8px;">
            <button type="submit" class="btn btn-primary" id="submit-job-btn">Publish</button>
            <button type="button" class="btn btn-secondary" id="cancel-job-btn">Cancel</button>
          </div>
        </form>
      </div>

      <div class="filter-bar">
        <input type="text" id="keyword-input" placeholder="Search by title or company" />
        <select id="type-select">
          <option value="">All types</option>
          <option value="internship">Internship</option>
          <option value="job">Job</option>
        </select>
        <select id="category-select">
          <option value="">All categories</option>
          <option>Engineering</option>
          <option>Business</option>
          <option>Design</option>
          <option>Marketing</option>
          <option>IT &amp; Data</option>
        </select>
      </div>

      <div id="listings-mount"></div>

      <div class="load-more-row" id="load-more-row" hidden>
        <button class="btn btn-primary" id="load-more-btn">Load more</button>
      </div>
      <div id="app-footer"></div>
    </main>
  </div>

</body>
</html>
