<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#635bff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0d9ff" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="46"/>
    </clipPath>
  </defs>

  <!-- Outer circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Graduation cap (mortarboard) -->
  <!-- Board top -->
  <polygon points="50,22 76,32 50,42 24,32" fill="white"/>
  <!-- Cap body / hanging tassel stem -->
  <rect x="71" y="32" width="3" height="14" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Tassel ball -->
  <circle cx="72.5" cy="47" r="2.5" fill="white" opacity="0.75"/>

  <!-- Left "C" arc -->
  <path d="M 44 53 A 14 14 0 1 0 44 76" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Right "C" arc (offset / interlocked) -->
  <path d="M 56 48 A 14 14 0 1 0 56 71" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- "CC" text label below arcs -->
  <text x="50" y="93" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="9" fill="white" letter-spacing="3" opacity="0.9">CAMPUS</text>
</svg>
