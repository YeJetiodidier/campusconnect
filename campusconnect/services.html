<!DOCTYPE html>
<html lang="en">
<head>

  <title>Student Services - CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
      <a href="marketplace.html" class="logo">
        <img src="logo.png" alt="CampusConnect Logo" class="logo-img">
        <span class="logo-text">CampusConnect</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="marketplace.html">Marketplace</a>
      <a href="services.html" class="active">Services</a>
    </nav>
    <div class="nav-right">
      <a href="offer-service.html" class="btn-primary">+ Offer a Service</a>

  <div class="container">

      <h1>Student Services</h1>
      <div class="search-filter-group">
